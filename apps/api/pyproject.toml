[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.importlinter]
root_package = "app"
# 엔진 패키지를 금지 대상으로 지정하려면 외부 패키지도 그래프에 포함해야 한다.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core must not import domains"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.documents", "app.outline", "app.wireframe", "app.workspaces", "app.llm_settings", "app.runtime"]

# Agent Core(Runtime + LLM Driver)는 실행 생애주기와 다중 모델 커널을 담당한다.
# 비즈니스 도메인(documents, outline, wireframe, workspaces)이나 문서 서식 엔진(scaffold_engine)을 알지 않는다.
[[tool.importlinter.contracts]]
name = "Agent Core is domain agnostic"
type = "forbidden"
source_modules = ["agent_runtime", "llm_driver"]
forbidden_modules = [
    "app.documents",
    "app.outline",
    "app.wireframe",
    "app.workspaces",
    "app.llm_settings",
    "app.runtime",
    "app.core.config",
    "scaffold_engine",
]

# Scaffold Engine 은 순수 문서 스캐폴딩 엔진이다.
# 에이전트 런타임이나 LLM 드라이버, 호스트 도메인을 직접 알지 않고 오직 LlmHarness 프로토콜만 안다.
[[tool.importlinter.contracts]]
name = "Scaffold Engine is independent"
type = "forbidden"
source_modules = ["scaffold_engine"]
forbidden_modules = [
    "agent_runtime",
    "llm_driver",
    "app.documents",
    "app.outline",
    "app.wireframe",
    "app.workspaces",
    "app.llm_settings",
    "app.runtime",
    "app.core",
]

# 저장 경로를 전역으로 공개하면 누구나 어댑터를 건너뛰고 디스크에 직접 쓸 수 있다.
# 경로를 아는 것은 저장 게이트(core.storage)와 조립 지점(bootstrap), 그리고
# 각 도메인의 adapters 뿐이다.
#
# **도메인을 열거하지 않고 세그먼트로 쓴다.** 예전에는 도메인마다 손으로 적었고,
# 그래서 목록에 없던 `inspector` 는 서비스가 `settings.storage.runs` 를 직접 열어도
# 아무 경고가 없었다. 허용목록은 새 도메인이 생길 때마다 조용히 낡는다.
[[tool.importlinter.contracts]]
name = "Storage paths are known only to adapters and bootstrap"
type = "forbidden"
# 직접 import 만 본다. core.llm 이 설정을 읽는 것은 정상이고, 그 경유까지 막으면
# 규칙의 뜻("경로를 스스로 만들지 마라")이 아니라 그래프 모양을 규제하게 된다.
allow_indirect_imports = true
source_modules = [
    "app.*.service",
    "app.*.use_cases",
    "app.*.agents",
    "app.*.experimental",
]
forbidden_modules = ["app.core.config"]
# 아래 셋은 **알려진 미해결 위반**이다. 세그먼트 계약으로 바꾸자마자 드러났다.
# `update_runtime_policy` 는 경로를 읽는 정도가 아니라 **전역 `settings` 객체를
# 런타임에 덮어쓴다** (`settings.primary_provider = ...`). 프로세스 전체가 공유하는
# 설정을 유스케이스가 변경하는 구조라, 포트를 하나 끼우는 것으로 끝나지 않고
# 실행 정책 흐름 전체를 손봐야 한다. 그때까지 **보이는 곳에** 남겨 둔다 —
# source_modules 에서 조용히 빼면 다시 보이지 않게 된다.
ignore_imports = [
    "app.llm_settings.service -> app.core.config",
    "app.llm_settings.use_cases.resolve_next_execution -> app.core.config",
    "app.llm_settings.use_cases.update_runtime_policy -> app.core.config",
]

# 도메인 간 직접 참조는 전부 금지한다. 다른 도메인의 동작이 필요하면 자기
# `ports.py` 에 계약을 정의하고 컨테이너가 구현체를 주입한다.
#
# `router.py` 는 source 에서 뺀다. 라우터는 조립 지점(`bootstrap.container`)을
# 통해 주입을 받고, 컨테이너는 정의상 모든 도메인을 안다 — 그 경유까지 막으면
# DI 자체가 위반이 된다.
#
# **계약 목록이 실제 도메인 디렉터리와 일치하는지는
# `tests/test_architecture_contracts.py` 가 지킨다.** 예전에는 여기에 적힌 네
# 도메인만 검사했고, 그래서 목록에 없던 `inspector` 는 다른 도메인의 저장
# 레이아웃을 직접 읽어도 아무 경고가 없었다. 허용목록은 조용히 낡는다.

[[tool.importlinter.contracts]]
name = "documents must not depend on other domains"
type = "forbidden"
source_modules = [
    "app.documents.service",
    "app.documents.use_cases",
    "app.documents.adapters",
    "app.documents.experimental",
    "app.documents.ports",
]
forbidden_modules = [
    "app.inspector",
    "app.llm_settings",
    "app.outline",
    "app.runtime",
    "app.wireframe",
    "app.workspaces",
]

