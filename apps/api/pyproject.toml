[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.importlinter]
root_package = "app"
# 엔진 패키지를 금지 대상으로 지정하려면 외부 패키지도 그래프에 포함해야 한다.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core must not import domains"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.documents", "app.outline", "app.wireframe", "app.workspaces", "app.llm_settings", "app.runtime"]

# Agent Core(Runtime + LLM Driver)는 실행 생애주기와 다중 모델 커널을 담당한다.
# 비즈니스 도메인(documents, outline, wireframe, workspaces)이나 문서 서식 엔진(scaffold_engine)을 알지 않는다.
[[tool.importlinter.contracts]]
name = "Agent Core is domain agnostic"
type = "forbidden"
source_modules = ["agent_runtime", "llm_driver"]
forbidden_modules = [
    "app.documents",
    "app.outline",
    "app.wireframe",
    "app.workspaces",
    "app.llm_settings",
    "app.runtime",
    "app.core.config",
    "scaffold_engine",
]

# Scaffold Engine 은 순수 문서 스캐폴딩 엔진이다.
# 에이전트 런타임이나 LLM 드라이버, 호스트 도메인을 직접 알지 않고 오직 LlmHarness 프로토콜만 안다.
[[tool.importlinter.contracts]]
name = "Scaffold Engine is independent"
type = "forbidden"
source_modules = ["scaffold_engine"]
forbidden_modules = [
    "agent_runtime",
    "llm_driver",
    "app.documents",
    "app.outline",
    "app.wireframe",
    "app.workspaces",
    "app.llm_settings",
    "app.runtime",
    "app.core",
]

# 저장 경로를 전역으로 공개하면 누구나 어댑터를 건너뛰고 디스크에 직접 쓸 수 있다.
# 경로를 아는 것은 저장 게이트(core.storage)와 조립 지점(bootstrap), 그리고
# 각 도메인의 adapters 뿐이다.
[[tool.importlinter.contracts]]
name = "Storage paths are known only to adapters and bootstrap"
type = "forbidden"
# 직접 import 만 본다. core.llm 이 설정을 읽는 것은 정상이고, 그 경유까지 막으면
# 규칙의 뜻("경로를 스스로 만들지 마라")이 아니라 그래프 모양을 규제하게 된다.
allow_indirect_imports = true
source_modules = [
    "app.documents.use_cases",
    "app.documents.experimental",
    "app.documents.service",
    "app.outline.service",
    "app.outline.agents",
    "app.wireframe.service",
    "app.wireframe.agents",
    "app.workspaces.service",
]
forbidden_modules = ["app.core.config"]

[[tool.importlinter.contracts]]
name = "Documents must not depend on other domains"
type = "forbidden"
source_modules = [
    "app.documents.service",
    "app.documents.use_cases",
    "app.documents.experimental",
    "app.documents.adapters",
]
forbidden_modules = ["app.workspaces", "app.wireframe", "app.outline"]

[[tool.importlinter.contracts]]
name = "Outline must not depend on other domains"
type = "forbidden"
source_modules = [
    "app.outline.service",
    "app.outline.adapters",
    "app.outline.agents",
]
forbidden_modules = ["app.documents", "app.wireframe", "app.workspaces"]

[[tool.importlinter.contracts]]
name = "Wireframe must not depend on other domains"
type = "forbidden"
source_modules = [
    "app.wireframe.service",
    "app.wireframe.adapters",
    "app.wireframe.agents",
]
forbidden_modules = ["app.documents", "app.outline", "app.workspaces"]

[[tool.importlinter.contracts]]
name = "Workspaces must not depend on document domains"
type = "forbidden"
source_modules = ["app.workspaces.service", "app.workspaces.adapters"]
forbidden_modules = ["app.documents", "app.outline", "app.wireframe"]
