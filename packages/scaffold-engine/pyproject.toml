[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-engine"
version = "0.1.0"
description = "Host-independent AI Document Scaffolding Engine for Tiptap & Antigravity"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "VibePatchNote Team" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
]

[project.scripts]
scaffold-engine = "scaffold_engine.cli:main"
